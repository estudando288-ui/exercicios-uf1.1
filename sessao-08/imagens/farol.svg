<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fundo / Céu Noturno -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- Estrelas -->
  <circle cx="50" cy="40" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="120" cy="70" r="1.2" fill="#f8fafc" opacity="0.6"/>
  <circle cx="320" cy="50" r="1.5" fill="#f8fafc" opacity="0.7"/>
  <circle cx="360" cy="90" r="1" fill="#f8fafc" opacity="0.5"/>

  <!-- Feixe de Luz -->
  <polygon points="190,85 390,30 400,140 190,95" fill="url(#lightBeam)"/>
  <polygon points="210,85 10,130 0,40 210,95" fill="url(#lightBeam)"/>

  <!-- Mar -->
  <path d="M0,230 Q100,225 200,230 T400,230 L400,300 L0,300 Z" fill="#0f172a"/>
  <path d="M0,245 Q100,240 200,245 T400,245 L400,300 L0,300 Z" fill="#0284c7" opacity="0.2"/>

  <!-- Falésia / Rochas -->
  <polygon points="120,300 140,210 260,210 280,300" fill="#1e293b"/>
  <polygon points="135,215 150,210 250,210 265,215" fill="#334155"/>

  <!-- Base do Farol -->
  <polygon points="160,210 170,110 230,110 240,210" fill="#f8fafc"/>

  <!-- Faixas Vermelhas Tradicionais -->
  <polygon points="163,185 166,160 234,160 237,185" fill="#dc2626"/>
  <polygon points="168,135 170,110 230,110 232,135" fill="#dc2626"/>

  <!-- Varanda e Lanterna -->
  <rect x="162" y="105" width="76" height="6" rx="2" fill="#0f172a"/>
  <rect x="175" y="80" width="50" height="25" fill="#fef08a"/>
  <line x1="187" y1="80" x2="187" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="80" x2="200" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="213" y1="80" x2="213" y2="105" stroke="#0f172a" stroke-width="2"/>

  <!-- Cúpula -->
  <path d="M173,80 Q200,60 227,80 Z" fill="#0f172a"/>
  <line x1="200" y1="60" x2="200" y2="52" stroke="#0f172a" stroke-width="3"/>
  <circle cx="200" cy="50" r="3" fill="#e2e8f0"/>
</svg>
